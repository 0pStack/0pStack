<svg width="620" height="262" viewBox="0 0 620 262" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f6f8fa; stroke: #d0d7de; }
    .bar { fill: #eaeef2; }
    .title { fill: #57606a; font-size: 13px; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; fill: #24292f; }
    .prompt { fill: #1a7f37; font-weight: 700; }
    .muted { fill: #57606a; }
    .ts { fill: #0969da; }
    .react { fill: #1b7c83; }
    .vite { fill: #8250df; }
    .sol { fill: #953800; }
    .hh { fill: #9a6700; }

    .line { opacity: 0; animation: show 0.01s forwards; }
    .cover { fill: #f6f8fa; }
    .caret { fill: #24292f; }
    .out { opacity: 0; animation: pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .w { fill-opacity: 0; animation: word 0.3s ease-out forwards; }
    .cursor { fill: #24292f; opacity: 0; animation: show 0.01s 6.8s forwards, blink 1.06s step-end 6.8s infinite; }

    @keyframes show { to { opacity: 1; } }
    @keyframes hide { to { opacity: 0; } }
    /* Per-keystroke gaps generated from hand-picked delays so typing has an uneven, human rhythm */
    @keyframes type1 { 0% { transform: translateX(0); } 22.22% { transform: translateX(9px); } 35.19% { transform: translateX(18px); } 52.78% { transform: translateX(27px); } 63.89% { transform: translateX(36px); } 84.26% { transform: translateX(45px); } 100% { transform: translateX(54px); } }
    @keyframes type2 { 0% { transform: translateX(0); } 9.17% { transform: translateX(9px); } 14.58% { transform: translateX(18px); } 21.25% { transform: translateX(27px); } 32.92% { transform: translateX(36px); } 40.42% { transform: translateX(45px); } 46.25% { transform: translateX(54px); } 55% { transform: translateX(63px); } 60% { transform: translateX(72px); } 67.08% { transform: translateX(81px); } 79.58% { transform: translateX(90px); } 87.5% { transform: translateX(99px); } 93.33% { transform: translateX(108px); } 100% { transform: translateX(117px); } }
    @keyframes type3 { 0% { transform: translateX(0); } 10.2% { transform: translateX(9px); } 17.25% { transform: translateX(18px); } 23.14% { transform: translateX(27px); } 27.84% { transform: translateX(36px); } 34.51% { transform: translateX(45px); } 47.06% { transform: translateX(54px); } 55.69% { transform: translateX(63px); } 61.18% { transform: translateX(72px); } 68.63% { transform: translateX(81px); } 73.73% { transform: translateX(90px); } 80% { transform: translateX(99px); } 88.24% { transform: translateX(108px); } 92.94% { transform: translateX(117px); } 100% { transform: translateX(126px); } }
    @keyframes pop {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes word { to { fill-opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .bar { fill: #161b22; }
      .title, .muted { fill: #8b949e; }
      text { fill: #e6edf3; }
      .prompt { fill: #3fb950; }
      .ts { fill: #58a6ff; }
      .react { fill: #39c5cf; }
      .vite { fill: #bc8cff; }
      .sol { fill: #ffa657; }
      .hh { fill: #e3b341; }
      .cover { fill: #0d1117; }
      .caret, .cursor { fill: #e6edf3; }
    }

    @media (prefers-reduced-motion: reduce) {
      .line, .out { opacity: 1; animation: none; }
      .w { fill-opacity: 1; animation: none; }
      .cover, .caret { display: none; }
      .cursor { opacity: 1; animation: none; }
    }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="619" height="261" rx="10"/>
  <path class="bar" d="M1 11a10 10 0 0 1 10-10h598a10 10 0 0 1 10 10v22H1z"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="17" r="6" fill="#febc2e"/>
  <circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text class="title" x="310" y="21" text-anchor="middle">atlas@0pStack: ~</text>

  <g class="line" style="animation-delay: 0.3s">
    <text class="prompt" x="22" y="70">$</text>
    <text x="40" y="70" textLength="54" lengthAdjust="spacing">whoami</text>
    <rect class="cover" x="40" y="54" width="54" height="22" style="animation: type1 0.54s step-end 0.65s forwards"/>
    <rect class="caret" x="40" y="57" width="9" height="17" style="animation: type1 0.54s step-end 0.65s forwards, hide 0.01s 1.45s forwards"/>
  </g>
  <text class="out" x="22" y="94" style="animation-delay: 1.45s">0pStack <tspan class="muted">·</tspan> Student @ Medieinstitutet, Stockholm</text>

  <g class="line" style="animation-delay: 1.9s">
    <text class="prompt" x="22" y="128">$</text>
    <text x="40" y="128" textLength="117" lengthAdjust="spacing">cat stack.txt</text>
    <rect class="cover" x="40" y="112" width="117" height="22" style="animation: type2 1.2s step-end 2.25s forwards"/>
    <rect class="caret" x="40" y="115" width="9" height="17" style="animation: type2 1.2s step-end 2.25s forwards, hide 0.01s 3.7s forwards"/>
  </g>
  <text class="out" x="22" y="152" style="animation-delay: 3.7s"><tspan class="ts w" style="animation-delay: 3.7s">TypeScript</tspan> <tspan class="muted w" style="animation-delay: 3.8s">·</tspan> <tspan class="react w" style="animation-delay: 3.8s">React</tspan> <tspan class="muted w" style="animation-delay: 3.9s">·</tspan> <tspan class="vite w" style="animation-delay: 3.9s">Vite</tspan> <tspan class="muted w" style="animation-delay: 4s">·</tspan> <tspan class="sol w" style="animation-delay: 4s">Solidity</tspan> <tspan class="muted w" style="animation-delay: 4.1s">·</tspan> <tspan class="hh w" style="animation-delay: 4.1s">Hardhat</tspan></text>

  <g class="line" style="animation-delay: 4.55s">
    <text class="prompt" x="22" y="186">$</text>
    <text x="40" y="186" textLength="126" lengthAdjust="spacing">./now --status</text>
    <rect class="cover" x="40" y="170" width="126" height="22" style="animation: type3 1.275s step-end 4.9s forwards"/>
    <rect class="caret" x="40" y="173" width="9" height="17" style="animation: type3 1.275s step-end 4.9s forwards, hide 0.01s 6.4s forwards"/>
  </g>
  <text class="out" x="22" y="210" style="animation-delay: 6.4s">Building with React + Solidity, one commit at a time</text>

  <g class="line" style="animation-delay: 6.8s">
    <text class="prompt" x="22" y="244">$</text>
  </g>
  <rect class="cursor" x="40" y="231" width="9" height="17"/>
</svg>
